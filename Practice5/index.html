<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Лучшие товары месяца</title>
    <link href="https://fonts.googleapis.com/css?family=Faster+One" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
      <header>
      </header>

      <section>
        <div id="productsContainer"></div>
      </section>

      <section id="chat">
        <h2>Чат поддержки</h2>
        <div id="chatContainer"></div>
        <input type="text" id="messageInput" placeholder="Введите сообщение...">
        <button onclick="sendMessage()">Отправить</button>
    </section>
    
      <script>
        // WebSocket соединение
        const socket = new WebSocket('ws://localhost:8080');
        
        // Обработчики WebSocket
        socket.onopen = () => {
            console.log('Соединение с чатом установлено');
        };

        socket.onmessage = (event) => {
            try {
                const message = JSON.parse(event.data);
                
                // Проверка структуры сообщения
                if (!message.user || !message.text) {
                    throw new Error('Некорректное сообщение');
                }

                const container = document.getElementById('chat');
                container.innerHTML += `
                    <div class="message">
                        <strong>${message.user}:</strong> ${message.text}
                    </div>
                `;
                container.scrollTop = container.scrollHeight;

            } catch (error) {
                console.error('Ошибка:', error);
                showError('Не удалось прочитать сообщение');
            }
        };

        // Функция отправки сообщений
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (!text) {
                showError('Введите сообщение!');
                return;
            }

            try {
                socket.send(JSON.stringify({
                    user: 'Покупатель', // Важное отличие от админа!
                    text: text,
                    timestamp: new Date().toISOString()
                }));
                input.value = '';
            } catch (error) {
                console.error('Ошибка отправки:', error);
                showError('Не удалось отправить сообщение');
            }
        }
        async function loadProducts() {
          const query = `{
                products {
                    name
                    price
                    categories
                }
            }`;

            try {
                const response = await fetch('http://localhost:3000/graphql', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });

                const { data, errors } = await response.json();
                
                if (errors) throw errors[0];
                
                if (data.products.length === 0) {
                    showEmptyState();
                    return;
                }

                showProducts(data.products);
            } catch (error) {
                console.error('Ошибка:', error);
                showError('Не удалось загрузить каталог');
            }
        }

        var requestURL = "http://localhost:3000/products";
        var request = new XMLHttpRequest(); 

        function showProducts(products) {
          const container = document.getElementById('productsContainer');
            container.innerHTML = products.map(product => `
                <article class="product-card">
                    <h3>${product.name}</h3>
                    <p>Цена: ${product.price.toLocaleString()} ₽</p>
                    <div class="categories">
                        Категории: ${product.categories.join(', ')}
                    </div>
                </article>
            `).join('');
        }

        function showEmptyState() {
            document.getElementById('productsContainer').innerHTML = `
                <div class="empty-state">
                    Товаров нет в наличии
                </div>
            `;
        }
        
        loadProducts();
      </script>
  </body>
</html>
