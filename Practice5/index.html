<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Лучшие товары месяца</title>
    <link href="https://fonts.googleapis.com/css?family=Faster+One" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
      <header>
      </header>

      <section id="filters">
        <!-- Фильтр по категориям -->
        <label for="categoryFilter">Фильтр по категории:</label>
        <select id="categoryFilter">
          <option value="Все">Все</option>
          <option value="Овощи">Овощи</option>
          <option value="Полуфабрикаты">Полуфабрикаты</option>
          <option value="Кисломолочное">Кисломолочное</option>
        </select>
      </section>
      
      <section>
        <div id="productsContainer"></div>
      </section>

      <section id="chat">
        <h2>Чат поддержки</h2>
        <div id="chatMessages" class="chat-messages"></div>
        <input type="text" id="messageInput" placeholder="Введите сообщение...">
        <button onclick="sendMessage()">Отправить</button>
    </section>
    
      <script>
        // WebSocket соединение
        const socket = new WebSocket('ws://localhost:8080');
        
        // Обработчики WebSocket
        socket.onopen = () => {
            console.log('Соединение с чатом установлено');
        };

        socket.onclose = (event) => {
            console.log('WebSocket закрыт:', event);
        };

        socket.onerror = (error) => {
            console.error('Ошибка WebSocket:', error);
        };

        socket.onmessage = (event) => {
            console.log('Получено сообщение:', event.data);
            try {
                const message = JSON.parse(event.data);
                
                // Проверка структуры сообщения
                if (!message.user || !message.text) {
                    throw new Error('Некорректное сообщение');
                }

                const container = document.getElementById('chatMessages');
                container.innerHTML += `
                    <div class="message">
                        <strong>${message.user}:</strong> ${message.text}
                    </div>
                `;
                container.scrollTop = container.scrollHeight;

            } catch (error) {
                console.error('Ошибка: не удалось прочитать сообщение', error);
            }
        };

        // Функция отправки сообщений
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (!text) {
                showError('Введите сообщение!');
                return;
            }

            try {
                socket.send(JSON.stringify({
                    user: 'Покупатель', // Важное отличие от админа!
                    text: text,
                }));
                input.value = '';
            } catch (error) {
                console.error('Ошибка отправки:', error);
                showError('Не удалось отправить сообщение');
            }
        }
        async function loadProducts() {
          const query = `{
                products {
                    name
                    price
                    description
                    categories
                }
            }`;

            try {
                const response = await fetch('http://localhost:3000/graphql', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
                const result = await response.json();

                const products = result.data.products;
                // Фильтрация товаров по выбранной категории
                const categoryFilter = document.getElementById('categoryFilter');
                const selectedCategory = categoryFilter.value;

                const filteredProducts = selectedCategory === "Все" ? products : products.filter(product => product.categories.includes(selectedCategory));

                showProducts(filteredProducts); // Отображаем отфильтрованные товары
            } catch (error) {
                console.error('Не удалось загрузить каталог, ошибка:', error);
                showError('Не удалось загрузить каталог');
            }
        }

        var requestURL = "http://localhost:3000/products";
        var request = new XMLHttpRequest(); 

        function showProducts(products) {
          const container = document.getElementById('productsContainer');
            container.innerHTML = products.map(product => `
                <article class="product-card">
                    <h3>${product.name}</h3>
                    <p>Цена: ${product.price.toLocaleString()} ₽</p>
                    <div class="categories">
                        Категории: ${product.categories.join(', ')}
                    </div>
                </article>
            `).join('');
        }

        function showEmptyState() {
            document.getElementById('productsContainer').innerHTML = `
                <div class="empty-state">
                    Товаров нет в наличии
                </div>
            `;
        }

        setInterval(async () => {
            await loadProducts();
        }, 5000); // Обновление каждые 5 секунд

        // Обработчик изменения фильтра
        document.getElementById('categoryFilter').addEventListener('change', () => {
            loadProducts(); // Перезагружаем товары при изменении фильтра
        });
        
        loadProducts();
      </script>
      <div id="root"></div>
      <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
